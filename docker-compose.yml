services:
  app:
    image: bitnami/laravel:latest
    container_name: absen_online_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=absen_online
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - MARIADB_HOST=db
      - MARIADB_PORT_NUMBER=3306
      - DB_MASTER_HOST=db
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: absen_online_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: absen_online
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: